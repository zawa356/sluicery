[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sluicery"
version = "0.1.0"
description = "yt-dlp を用いた自己ホスト向けプレイリスト同期サーバー"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: 外部ネットワークに依存するテスト（既定でスキップ）",
]
addopts = "-m 'not network'"
