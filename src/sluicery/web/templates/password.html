{% extends "base.html" %}
{% block title %}パスワード変更 — sluicery{% endblock %}
{% block content %}
<h1>パスワード変更</h1>
{% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/settings/password" class="stacked-form panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>現在のパスワード
    <input type="password" name="current_password" autocomplete="current-password" required>
  </label>
  <label>新しいパスワード（12文字以上）
    <input type="password" name="new_password" minlength="12" autocomplete="new-password" required>
  </label>
  <button type="submit">変更して再ログイン</button>
</form>
{% endblock %}
